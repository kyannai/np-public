<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normanton Park — Feedback Dashboard</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ebf4ff}
  .card{background:#fff;padding:32px 36px;border-radius:10px;box-shadow:0 10px 40px rgba(44,82,130,.15);width:340px;text-align:center}
  .card h1{font-size:18px;color:#2c5282;margin:0 0 4px}
  .card p{font-size:13px;color:#718096;margin:0 0 18px}
  .card input[type=password]{width:100%;padding:10px 12px;border:1px solid #cbd5e0;border-radius:6px;font-size:14px;margin-bottom:10px}
  .card button{width:100%;padding:10px;background:#2c5282;color:#fff;border:0;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
  .card .rm{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:#718096;margin-bottom:14px}
  .err{color:#c53030;font-size:12px;min-height:16px;margin-top:8px}
  #unsupported{display:none;max-width:360px;font-size:13px;color:#742a2a;background:#fff5f5;border:1px solid #feb2b2;padding:16px 18px;border-radius:8px;line-height:1.5}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="form">
    <h1>Feedback Dashboard</h1>
    <p>Enter the dashboard password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <label class="rm"><input id="rm" type="checkbox" checked> Remember me on this device</label>
    <button type="submit" id="go">Enter</button>
    <div class="err" id="err"></div>
    <div id="unsupported">This dashboard needs a recent browser. Please update to the latest Chrome, Safari (16.4+), Edge, or Firefox (113+).</div>
  </form>
</div>
<script>
const SALT_HEX = "37d789fea1079842284af82e16c61f58", ITERS = 200000;
const ANALYSIS_URL = "dashboard_analysis.enc", CASES_URL = "dashboard_cases.enc", LS_KEY = "np_dashboard_key";
const enc = new TextEncoder();
const hexToBytes = h => new Uint8Array(h.match(/../g).map(b => parseInt(b, 16)));

if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
  document.getElementById('unsupported').style.display = 'block';
  document.getElementById('pw').disabled = true;
  document.getElementById('go').disabled = true;
}

async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: hexToBytes(SALT_HEX), iterations: ITERS, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function fetchDecryptGunzip(url, key){
  const data = new Uint8Array(await (await fetch(url, {cache:'no-cache'})).arrayBuffer());
  const iv = data.slice(0, 12), ct = data.slice(12);
  const gz = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct); // throws on wrong key
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function unlockWithKey(key){
  const analysisP = fetchDecryptGunzip(ANALYSIS_URL, key);  // gate first paint on this
  const casesP    = fetchDecryptGunzip(CASES_URL, key);     // download in parallel
  const analysisHtml = await analysisP;                     // throws -> wrong password
  // Replace this shell with the decrypted dashboard. document.write keeps the
  // real page URL, so in-page anchors AND cross-page links (All reports,
  // Cluster Map) resolve against the site origin and navigate normally.
  document.open();
  document.write(analysisHtml);
  document.close();
  // The dashboard's inline scripts (data, functions, modal-wait shim) have now
  // run; hand cases over once they finish downloading.
  casesP.then(function(t){
    try { (window.__onCasesReady || function(c){ window.CASES = c; })(JSON.parse(t)); }
    catch(e){ /* cases unavailable; modals show their empty state */ }
  });
  return key;
}
async function unlock(pw, remember){
  const key = await deriveKey(pw);
  await unlockWithKey(key);
  if (remember){
    const raw = await crypto.subtle.exportKey('raw', key);
    localStorage.setItem(LS_KEY, btoa(String.fromCharCode(...new Uint8Array(raw))));
  }
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  const go = document.getElementById('go'); go.textContent = 'Decrypting\u2026';
  try { await unlock(document.getElementById('pw').value, document.getElementById('rm').checked); }
  catch(ex){ err.textContent = 'Wrong password.'; go.textContent = 'Enter'; }
});
(async function(){
  const b = localStorage.getItem(LS_KEY);
  if (!b || !(window.crypto && crypto.subtle && window.DecompressionStream)) return;
  try {
    const raw = Uint8Array.from(atob(b), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, true, ['decrypt']);
    await unlockWithKey(key);
  } catch(e){ localStorage.removeItem(LS_KEY); }
})();
</script>
</body>
</html>
